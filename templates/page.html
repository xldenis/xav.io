{% extends "base.html" %}

{% block head %}
{% set title = page.title %}
{{ super() }}
{% if page.extra.unlisted %}
<meta name="robots" content="noindex, nofollow">
{% endif %}
{% endblock head %}

{% block content %}
<article>
<h1>{{ page.title }}</h1>
<p class="subtitle">{{ page.date | date(format="%B %d, %Y") | safe }}</p>
{{ page.content | safe }}
</article>
{% endblock content %}
